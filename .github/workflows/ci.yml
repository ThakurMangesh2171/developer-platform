name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      working-directory: ./services/developer-platform-api
      run: mvn clean package -DskipTests
      # Tests are skipped here to speed up the workflow, 
      # but in a real scenario you would run tests: mvn clean test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './apps/developer-platform-ui/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./apps/developer-platform-ui
      run: npm ci
        
    - name: Build Next.js
      working-directory: ./apps/developer-platform-ui
      run: npm run build
