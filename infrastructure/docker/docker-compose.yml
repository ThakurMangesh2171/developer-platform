services:

  postgres:
    image: postgres:17
    container_name: developer-platform-postgres
    hostname: developer-platform-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - developer-platform-network

  redis:
    image: redis:8
    container_name: developer-platform-redis
    hostname: developer-platform-redis

    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - developer-platform-network

volumes:
  postgres-data:
    name: developer-platform-postgres-data

networks:
  developer-platform-network:
    name: developer-platform-network
    driver: bridge