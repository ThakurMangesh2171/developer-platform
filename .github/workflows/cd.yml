name: Continuous Deployment

on:
  push:
    tags:
      - 'v*.*.*' # Triggers when a new version tag is pushed (e.g. v1.0.0)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push Backend API
      uses: docker/build-push-action@v5
      with:
        context: ./services/developer-platform-api
        file: ./services/developer-platform-api/Dockerfile.prod
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/developer-platform-api:latest,${{ secrets.DOCKERHUB_USERNAME }}/developer-platform-api:${{ github.ref_name }}
        
    - name: Build and push Frontend UI
      uses: docker/build-push-action@v5
      with:
        context: ./apps/developer-platform-ui
        file: ./apps/developer-platform-ui/Dockerfile.prod
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/developer-platform-ui:latest,${{ secrets.DOCKERHUB_USERNAME }}/developer-platform-ui:${{ github.ref_name }}
        
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Deployment Webhook
      # Example: Triggering a Portainer webhook or custom deployment script on the target server
      run: |
        curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }}
