services:

  postgres:
    image: postgres:17
    container_name: developer-platform-postgres
    hostname: developer-platform-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - developer-platform-network

  redis:
    image: redis:8
    container_name: developer-platform-redis
    hostname: developer-platform-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - developer-platform-network

  api:
    build:
      context: ../../services/developer-platform-api
      dockerfile: Dockerfile.prod
    container_name: developer-platform-api
    hostname: developer-platform-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - POSTGRES_HOST=developer-platform-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=developer-platform-redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - developer-platform-network

  frontend:
    build:
      context: ../../apps/developer-platform-ui
      dockerfile: Dockerfile.prod
    container_name: developer-platform-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - developer-platform-network

volumes:
  postgres-data:
    name: developer-platform-postgres-data-prod

networks:
  developer-platform-network:
    name: developer-platform-network-prod
    driver: bridge
