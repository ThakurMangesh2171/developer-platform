spring:
  application:
    name: developer-platform-api

  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  security:
    jwt:
      secret: ${JWT_SECRET:9a4f2c8d3b7a1e6f5c8d9a0b3c2e1f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:3600000} # 1 hour
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days