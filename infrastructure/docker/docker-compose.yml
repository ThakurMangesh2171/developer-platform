services:

  postgres:
    image: postgres:17
    container_name: developer-platform-postgres
    hostname: developer-platform-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - developer-platform-network

  redis:
    image: redis:8
    container_name: developer-platform-redis
    hostname: developer-platform-redis

    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - developer-platform-network

  api:
    build:
      context: ../../services/developer-platform-api
      dockerfile: Dockerfile
    container_name: developer-platform-api
    hostname: developer-platform-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - POSTGRES_HOST=developer-platform-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=developer-platform-redis
      - REDIS_PORT=6379
      - JWT_SECRET=9a4f2c8d3b7a1e6f5c8d9a0b3c2e1f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - developer-platform-network

  frontend:
    build:
      context: ../../apps/developer-platform-ui
      dockerfile: Dockerfile
    container_name: developer-platform-frontend
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/developer-platform-ui:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - developer-platform-network

volumes:
  postgres-data:
    name: developer-platform-postgres-data

networks:
  developer-platform-network:
    name: developer-platform-network
    driver: bridge